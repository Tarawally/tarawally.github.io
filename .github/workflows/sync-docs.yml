name: Sync Fluid Docs

on:
  repository_dispatch:
    types: [docs_updated]
  workflow_dispatch:

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Digital Garden
        uses: actions/checkout@v3
        with:
          path: garden

      - name: Checkout Fluid Repo
        uses: actions/checkout@v3
        with:
          repository: Tarawally/fluid-light-transport
          path: fluid

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Build Quarto Book
        working-directory: fluid/docs
        run: |
          quarto render

      - name: Prepare Directories
        working-directory: garden
        run: |
          mkdir -p content/fluid-light-transport
          mkdir -p static/fluid-book

      - name: Synchronise Static Assets
        run: |
          # Copy the built Quarto site to the static folder of the garden
          cp -r fluid/docs/_site/* garden/static/fluid-book/

      - name: Run Conversion Script
        run: |
          # Transform .qmd to .md with iframe embeddings
          # The script is located in the fluid repo but we run it to output to garden
          node fluid/scripts/sync-to-quartz.js garden/content/fluid-light-transport

      - name: Commit and Push Changes
        working-directory: garden
        run: |
          git config user.name "Garden Bot"
          git config user.email "bot@digitalgarden.io"
          git add content/fluid-light-transport static/fluid-book
          # Commit using conventional commits
          git commit -m "feat(content): synchronise fluid-light-transport docs" || echo "No changes to commit"
          git push